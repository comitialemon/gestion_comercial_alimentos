version: "3.9"

services:
  vite:
    # Mantiene tu imagen y rutas, pero:
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    # Sobrescribimos volumes para aislar node_modules del host
    volumes:
      - ./:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    # Arranca solo; si no hay node_modules hace install y ejecuta dev con --host
    command: >
      sh -lc "
        if [ ! -d node_modules ]; then
          npm ci || npm install
        fi
        npm run dev -- --host
      "

volumes:
  vite_node_modules:
